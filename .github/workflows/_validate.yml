name: Reusable validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gmsh libglu1-mesa libxcursor1 libxinerama1 libxft2 libfltk1.3 \
            libgl1 libgl1-mesa-dri libosmesa6 xvfb

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy src

      - name: Test
        env:
          PYVISTA_OFF_SCREEN: "true"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          DISPLAY: ":99"
        run: |
          xvfb-run --auto-servernum poetry run pytest \
            -k "not TestPreviewImagesOutput and not test_preview_images"
