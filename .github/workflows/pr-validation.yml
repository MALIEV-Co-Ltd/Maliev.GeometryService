name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - staging
      - main

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version_format: ${{ steps.set-version.outputs.version_format }}
    steps:
      - id: set-version
        run: |
          BASE_BRANCH="${{ github.base_ref }}"
          if ["$BASE_BRANCH" == "main"]; then
            VERSION_FORMAT="1.0.*"
          elif ["$BASE_BRANCH" == "staging"]; then
            VERSION_FORMAT="1.0.*-beta*"
          else
            VERSION_FORMAT="1.0.*-alpha*"
          fi
          echo "version_format=$VERSION_FORMAT" >> $GITHUB_OUTPUT

  build-and-test:
    needs: prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gmsh libglu1-mesa libxcursor1 libxinerama1 libxft2 libfltk1.3 libosmesa6

      - name: Install dependencies
        run: poetry install

      - name: Lint
        run: poetry run ruff check .

      - name: Test
        run: poetry run pytest
        working-directory: ${{ github.workspace }}
        env:
          PYVISTA_OFF_SCREEN: "true"
          MESA_GL_VERSION_OVERRIDE: "3.3"
