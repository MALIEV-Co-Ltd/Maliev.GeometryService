name: PR validation

on:
  pull_request:
    branches:
      - develop
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-browser-worker-smoke:
    name: Real browser worker smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run real Chrome Web Worker smoke
        env:
          MALIEV_BROWSER_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          test -x "${MALIEV_BROWSER_PATH}"
          "${MALIEV_BROWSER_PATH}" --version
          node --version
          node --test tests/client-runtime-browser-smoke.test.mjs

  validate:
    uses: ./.github/workflows/_validate.yml
