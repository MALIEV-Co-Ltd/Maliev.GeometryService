name: CI - Staging

on:
  push:
    tags:
      - "release/v*"
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gmsh libglu1-mesa libxcursor1 libxinerama1 libxft2 libfltk1.3
      - name: Install dependencies
        run: poetry install
      - name: Test
        run: poetry run pytest
        working-directory: ${{ github.workspace }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: maliev-website
      - name: Build and push Docker image
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev
          export RELEASE_VERSION=$(echo ${{ github.ref }} | sed -e 's,.*/v,,g')
          docker build -t asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-staging/maliev-geometryservice:$RELEASE_VERSION -f Dockerfile .
          docker push asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-staging/maliev-geometryservice:$RELEASE_VERSION
      - name: Checkout maliev-gitops repository
        uses: actions/checkout@v5
        with:
          repository: MALIEV-Co-Ltd/maliev-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: maliev-gitops
      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "v5.8.0"
      - name: Update image tag in maliev-gitops using Kustomize
        run: |
          export RELEASE_VERSION=$(echo ${{ github.ref }} | sed -e 's,.*/v,,g')
          cd maliev-gitops/3-apps/maliev-geometry-service/overlays/staging
          kustomize edit set image \
            asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact/maliev-geometryservice=\
            asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-staging/maliev-geometryservice:$RELEASE_VERSION
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
          PR_BODY: |
            Automated GitOps Update

            - **Service**: maliev-geometryservice
            - **Environment**: Staging
            - **Release**: ${{ github.ref_name }}
            - **Image Tag**: ${{ github.ref_name }}
            - **Commit**: ${{ github.sha }}

            Updates maliev-geometryservice image in staging overlay.
            This PR was automatically created by GitHub Actions.
            Once merged, ArgoCD will automatically sync the changes to the maliev-staging namespace.

            Triggered by: ${{ github.actor }}
            Workflow: ${{ github.workflow }}
            Run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        run: |
          cd maliev-gitops
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Extract release version
          export RELEASE_VERSION=$(echo ${{ github.ref }} | sed -e 's,.*/v,,g')

          # Create a new branch for this update
          BRANCH_NAME="maliev-geometryservice/staging-$RELEASE_VERSION"
          git checkout -b $BRANCH_NAME

          # Commit and push changes to the new branch
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(staging): Update maliev-geometryservice image to $RELEASE_VERSION"
          git push origin $BRANCH_NAME

          # Create pull request using GitHub CLI
          gh pr create \
            --title "chore(staging): Update maliev-geometryservice" \
            --body "$PR_BODY" \
            --base main \
            --head $BRANCH_NAME \
            --repo MALIEV-Co-Ltd/maliev-gitops
