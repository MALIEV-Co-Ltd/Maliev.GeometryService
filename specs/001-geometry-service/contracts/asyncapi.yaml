asyncapi: '3.0.0'

info:

  title: Geometry Analysis Service Events

  version: 1.0.0

  description: Event-driven interface for 3D geometry analysis.

channels:

  upload.service.events:

    address: upload-service-events

    messages:

      FileUploadedEvent:

        $ref: '#/components/messages/FileUploadedEvent'

  geometry.service.events:

    address: maliev-geometryservice-events

    messages:

      FileMetricsReadyEvent:

        $ref: '#/components/messages/FileMetricsReadyEvent'

      FileAnalyzedEvent:

        $ref: '#/components/messages/FileAnalyzedEvent'

      FileAnalysisFailedEvent:

        $ref: '#/components/messages/FileAnalysisFailedEvent'

components:

  messages:

    FileUploadedEvent:

      payload:

        type: object

        required: [messageId, correlationId, payload]

        properties:

          messageId:

            type: string

            format: uuid

          correlationId:

            type: string

            format: uuid

          payload:

            type: object

            required: [fileId, storageBucket, storageKey]

            properties:

              fileId:

                type: string

                format: uuid

              storageBucket:

                type: string

              storageKey:

                type: string

              contentType:

                type: string

              uploadedAt:

                type: string

                format: date-time

    FileMetricsReadyEvent:

      payload:

        type: object

        required: [messageId, correlationId, payload]

        properties:

          messageId:

            type: string

            format: uuid

          correlationId:

            type: string

            format: uuid

          payload:

            type: object

            required: [fileId, storagePath, metrics]

            properties:

              fileId:

                type: string

                format: uuid

              storagePath:

                type: string

              metrics:

                type: object

                properties:

                  volumeCm3:

                    type: number

                  surfaceAreaCm2:

                    type: number

                  boundingBox:

                    type: object

                    properties:

                      x:{type: number}

                      y:{type: number}

                      z:{type: number}

                  isManifold:

                    type: boolean

                  eulerNumber:

                    type: integer

                  triangleCount:

                    type: integer

              processedAt:

                type: string

                format: date-time

              bodyCount:

                type: integer

                description: Number of bodies in the CAD file (1 for single-body, >1 for assemblies)

              bodies:

                type: array

                description: Per-body metadata for multi-body files

                items:

                  type: object

                  properties:

                    index:

                      type: integer

                      description: Zero-based body index

                    name:

                      type: string

                      description: Stable body name from glTF node or generated "Body_NN" format

                    volumeCm3:

                      type: number

                      description: Volume of this body in cm³

                    bboxMin:

                      type: object

                      properties:

                        x: {type: number}

                        y: {type: number}

                        z: {type: number}

                      description: Minimum XYZ coordinates in mm

                    bboxMax:

                      type: object

                      properties:

                        x: {type: number}

                        y: {type: number}

                        z: {type: number}

                      description: Maximum XYZ coordinates in mm

    FileAnalyzedEvent:

      payload:

        type: object

        required: [messageId, correlationId, payload]

        properties:

          messageId:

            type: string

            format: uuid

          correlationId:

            type: string

            format: uuid

          payload:

            type: object

            required: [fileId, metrics]

            properties:

              fileId:

                type: string

                format: uuid

              metrics:

                type: object

                properties:

                  volumeCm3:

                    type: number

                  surfaceAreaCm2:

                    type: number

                  boundingBox:

                    type: object

                    properties:

                      x:{type: number}

                      y:{type: number}

                      z:{type: number}

                  isManifold:

                    type: boolean

                  eulerNumber:

                    type: integer

                  triangleCount:

                    type: integer

              processedAt:

                type: string

                format: date-time

              bodyCount:

                type: integer

                description: Number of bodies in the CAD file (1 for single-body, >1 for assemblies)

              bodies:

                type: array

                description: Per-body metadata for multi-body files

                items:

                  type: object

                  properties:

                    index:

                      type: integer

                      description: Zero-based body index

                    name:

                      type: string

                      description: Stable body name from glTF node or generated "Body_NN" format

                    volumeCm3:

                      type: number

                      description: Volume of this body in cm³

                    bboxMin:

                      type: object

                      properties:

                        x: {type: number}

                        y: {type: number}

                        z: {type: number}

                      description: Minimum XYZ coordinates in mm

                    bboxMax:

                      type: object

                      properties:

                        x: {type: number}

                        y: {type: number}

                        z: {type: number}

                      description: Maximum XYZ coordinates in mm

    FileAnalysisFailedEvent:

      payload:

        type: object

        required: [messageId, correlationId, payload]

        properties:

          messageId:

            type: string

            format: uuid

          correlationId:

            type: string

            format: uuid

          payload:

            type: object

            required: [fileId, errorCode]

            properties:

              fileId:

                type: string

                format: uuid

              errorCode:

                type: string

                enum: [GEOMETRY_NON_MANIFOLD, FILE_CORRUPT, SIZE_LIMIT_EXCEEDED, TIMEOUT, MULTI_BODY_ERROR]

              details:

                type: string
